services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: comercial_link
      MYSQL_USER: comercial
      MYSQL_PASSWORD: comercial
      MYSQL_ROOT_PASSWORD: cambia-root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
