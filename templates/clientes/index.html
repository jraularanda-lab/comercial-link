{% extends 'base.html' %}{% block content %}<h2>Clientes</h2><div class="card p-3 mb-3"><form method="post" class="row g-2"><div class="col-md-4"><input name="nombre" class="form-control" placeholder="Nombre" required></div><div class="col-md-3"><input name="telefono" class="form-control" placeholder="Teléfono"></div><div class="col-md-3"><input name="email" class="form-control" placeholder="Email"></div><div class="col-md-2"><button class="btn btn-primary">Guardar</button></div></form></div><table class="table"><tr><th>Nombre</th><th>Teléfono</th><th>Email</th></tr>{% for c in clientes %}<tr><td>{{c.nombre}}</td><td>{{c.telefono}}</td><td>{{c.email}}</td></tr>{% endfor %}</table>{% endblock %}
