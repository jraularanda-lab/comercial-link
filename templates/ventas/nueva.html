{% extends "base.html" %}
{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Nueva Venta / Ticket</h2>
        <a href="{{ url_for('ventas.index') }}" class="btn btn-outline-secondary">Regresar</a>
    </div>

    <form method="POST" action="{{ url_for('ventas.nueva') }}" id="formVenta">
        <div class="row">
            <!-- Columna Izquierda: Datos Generales (Canal, Fecha, Cliente) -->
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Datos Generales</h5>
                        
                        <div class="mb-3">
                            <label class="form-label">Canal de Venta</label>
                            <select name="canal" class="form-select" required>
                                <option value="Mostrador">Mostrador</option>
                                <option value="Mercado Libre">Mercado Libre</option>
                                <option value="WhatsApp">WhatsApp</option>
                                <option value="Facebook">Facebook</option>
                                <option value="VENTA_DIRECTA" selected>Venta Directa</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha de Venta</label>
                            <!-- Modificado a type="date" manteniendo la fecha del día por defecto -->
                            <input type="date" class="form-control" id="fecha" name="fecha" value="{{ fecha_hoy }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-flex justify-content-between align-items-center">
                                Cliente
                                <button type="button" class="btn btn-sm btn-link p-0 text-decoration-none" onclick="toggleNuevoCliente()">
                                    + Nuevo Cliente al Vuelo
                                </button>
                            </label>
                            <select name="id_cliente" id="selectCliente" class="form-select">
                                <option value="">-- Público General / Sin Cliente --</option>
                                {% for c in clientes %}
                                <option value="{{ c.id }}">{{ c.nombre }} {% if c.telefono %} ({{ c.telefono }}){% endif %}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Sección desplegable para agregar cliente al vuelo -->
                        <div id="seccionNuevoCliente" class="border rounded p-3 bg-light mb-3" style="display: none;">
                            <h6 class="text-primary mb-2">Registro Rápido de Cliente</h6>
                            <div class="mb-2">
                                <input type="text" id="nuevo_nombre" class="form-control form-control-sm" placeholder="Nombre completo *">
                            </div>
                            <div class="mb-2">
                                <input type="text" id="nuevo_telefono" class="form-control form-control-sm" placeholder="Teléfono">
                            </div>
                            <div class="mb-2">
                                <input type="email" id="nuevo_email" class="form-control form-control-sm" placeholder="Correo electrónico">
                            </div>
                            <button type="button" id="btnGuardarCliente" class="btn btn-sm btn-success w-100">Guardar y Seleccionar</button>
                        </div>

                        <hr>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Completar Venta</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Selección de Productos -->
            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Productos</h5>
                        
                        <div class="row g-2 mb-3">
                            <div class="col-md-8">
                                <select id="selectProductoCatalogo" class="form-select">
                                    <option value="">-- Seleccione un producto para agregar --</option>
                                    {% for prod, stock in productos %}
                                    <option value="{{ prod.id }}" data-nombre="{{ prod.nombre }}" data-precio="{{ prod.precio_venta }}" data-stock="{{ stock }}">
                                        {{ prod.sku }} - {{ prod.nombre }} (Stock: {{ stock }}) - ${{ prod.precio_venta }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <button type="button" id="btnAgregarProducto" class="btn btn-outline-primary w-100">Agregar al Ticket</button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-bordered align-middle" id="tablaDetalle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Producto</th>
                                        <th style="width: 100px;">Cantidad</th>
                                        <th style="width: 130px;">Precio Unit.</th>
                                        <th style="width: 130px;">Subtotal</th>
                                        <th style="width: 60px;">Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Filas dinámicas del carrito -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
function toggleNuevoCliente() {
    const seccion = document.getElementById('seccionNuevoCliente');
    if (seccion.style.display === 'none' || seccion.style.display === '') {
        seccion.style.display = 'block';
        document.getElementById('nuevo_nombre').focus();
    } else {
        seccion.style.display = 'none';
    }
}

document.getElementById('btnGuardarCliente').addEventListener('click', function() {
    const nombre = document.getElementById('nuevo_nombre').value;
    const telefono = document.getElementById('nuevo_telefono').value;
    const email = document.getElementById('nuevo_email').value;

    if (!nombre) {
        alert('El nombre del cliente es obligatorio.');
        return;
    }

    const formData = new URLSearchParams();
    formData.append('nombre', nombre);
    formData.append('telefono', telefono);
    formData.append('email', email);

    fetch("{{ url_for('ventas.cliente_rapido') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            const select = document.getElementById('selectCliente');
            const opt = document.createElement('option');
            opt.value = data.cliente.id;
            opt.text = data.cliente.nombre + (data.cliente.telefono ? ` (${data.cliente.telefono})` : '');
            opt.selected = true;
            select.add(opt);

            document.getElementById('nuevo_nombre').value = '';
            document.getElementById('nuevo_telefono').value = '';
            document.getElementById('nuevo_email').value = '';
            document.getElementById('seccionNuevoCliente').style.display = 'none';
        } else {
            alert('Error: ' + data.message);
        }
    })
    .catch(error => console.error('Error:', error));
});

document.getElementById('btnAgregarProducto').addEventListener('click', function() {
    const select = document.getElementById('selectProductoCatalogo');
    const option = select.options[select.selectedIndex];
    
    if (!option.value) {
        alert('Por favor selecciona un producto.');
        return;
    }

    const id = option.value;
    const nombre = option.getAttribute('data-nombre');
    const precio = parseFloat(option.getAttribute('data-precio'));
    const stock = parseInt(option.getAttribute('data-stock'));

    if (stock < 1) {
        alert('Producto sin stock disponible en la ubicación 1.');
        return;
    }

    const tbody = document.querySelector('#tablaDetalle tbody');
    
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td>${nombre} <input type="hidden" name="producto_id[]" value="${id}"></td>
        <td><input type="number" name="cantidad[]" value="1" min="1" max="${stock}" class="form-control form-control-sm input-cantidad" onchange="actualizarSubtotalFila(this.closest('tr'))"></td>
        <td><input type="number" step="0.01" name="precio[]" value="${precio}" class="form-control form-control-sm input-precio" onchange="actualizarSubtotalFila(this.closest('tr'))"></td>
        <td class="text-end subtotal-linea">$${precio.toFixed(2)}</td>
        <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">X</button></td>
    `;
    tbody.appendChild(tr);

    select.value = "";
});

function actualizarSubtotalFila(row) {
    const cant = parseFloat(row.querySelector('.input-cantidad').value) || 0;
    const precio = parseFloat(row.querySelector('.input-precio').value) || 0;
    const subtotal = cant * precio;
    row.querySelector('.subtotal-linea').innerText = `$${subtotal.toFixed(2)}`;
}
</script>
{% endblock %}
