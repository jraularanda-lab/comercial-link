<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceso · Comercial Link</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body{
    min-height:100vh;margin:0;
    background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',system-ui,sans-serif;
  }
  .login-card{
    background:#fff;border-radius:18px;padding:40px 36px;
    width:100%;max-width:400px;
    box-shadow:0 20px 60px rgba(15,23,42,.25);
  }
  .login-logo{
    width:56px;height:56px;border-radius:14px;
    background:#eef2ff;color:#4f46e5;
    display:flex;align-items:center;justify-content:center;
    font-size:1.7rem;margin:0 auto 18px;
  }
  .login-title{text-align:center;font-weight:700;font-size:1.4rem;margin-bottom:4px}
  .login-sub{text-align:center;color:#64748b;font-size:.88rem;margin-bottom:28px}
  .form-control{border-radius:9px;padding:11px 14px;border:1px solid #e5e7eb}
  .form-control:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.15)}
  .btn-login{
    background:#4f46e5;border:0;border-radius:9px;padding:12px;
    font-weight:600;width:100%;color:#fff;transition:background .15s;
  }
  .btn-login:hover{background:#4338ca}
  .login-footer{text-align:center;color:#94a3b8;font-size:.78rem;margin-top:22px}
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo"><i class="bi bi-box-seam"></i></div>
    <div class="login-title">Comercial Link</div>
    <div class="login-sub">Inicia sesión para continuar</div>

    {% with messages=get_flashed_messages(with_categories=true) %}
      {% for category,msg in messages %}
        <div class="alert alert-{{ category }} py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <label class="form-label small fw-semibold">Usuario</label>
      <div class="input-group mb-3">
        <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
        <input class="form-control" name="usuario" required autofocus>
      </div>

      <label class="form-label small fw-semibold">Contraseña</label>
      <div class="input-group mb-4">
        <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
        <input class="form-control" type="password" name="password" required>
      </div>

      <button class="btn-login">Entrar</button>
    </form>

    <div class="login-footer">Usuario inicial: <strong>admin / admin123</strong></div>
  </div>
</body>
</html>
