{% extends 'base.html' %}{% block content %}<h2>Reportes</h2><form class="row g-2 mb-3"><div class="col-md-3"><input type="date" name="start" value="{{start}}" class="form-control"></div><div class="col-md-3"><input type="date" name="end" value="{{end}}" class="form-control"></div><div class="col-md-2"><button class="btn btn-primary">Consultar</button></div><div class="col-md-2"><a class="btn btn-outline-secondary" href="{{url_for('reportes.csv_ventas',start=start,end=end)}}">CSV</a></div></form><div class="card p-3 mb-3">Total vendido: <b>${{total}}</b></div><table class="table"><tr><th>Folio</th><th>Fecha</th><th>Canal</th><th>Total</th><th>Estatus</th></tr>{% for v in ventas %}<tr><td>{{v.folio}}</td><td>{{v.fecha}}</td><td>{{v.canal}}</td><td>${{v.total}}</td><td>{{v.estatus}}</td></tr>{% endfor %}</table>{% endblock %}
